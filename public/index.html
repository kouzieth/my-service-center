<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Service Center</title>
<style>
  body{font-family:Arial;padding:12px;max-width:720px;margin:auto}
  #chat{border:1px solid #ddd;padding:12px;height:60vh;overflow:auto;background:#fafafa}
  .msg{margin:8px 0}
  .me{text-align:right}
  .bot{text-align:left;color:#222}
  form{display:flex;gap:8px;margin-top:8px}
  input{flex:1;padding:8px}
</style>
</head>
<body>
<h2>Chat dengan CS</h2>
<div id="chat"></div>
<form id="f">
  <input id="t" autocomplete="off" placeholder="Ketik pesan..." required />
  <button>Kirim</button>
</form>

<script>
const session = localStorage.getItem('sc_session') || (Math.random().toString(36).slice(2));
localStorage.setItem('sc_session', session);
const chatEl = document.getElementById('chat');
const f = document.getElementById('f');
const t = document.getElementById('t');

async function load() {
  try {
    const res = await fetch(`/api/messages?session=${session}`);
    const j = await res.json();
    chatEl.innerHTML = j.map(m=>{
      const cls = m.sender === 'user' ? 'me' : (m.sender === 'admin' ? 'bot' : 'bot');
      return `<div class="msg ${cls}"><small>${m.sender}</small><div>${escape(m.text)}</div></div>`;
    }).join('');
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch(e) { console.error(e); }
}

function escape(s){ return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;') : ''; }

f.addEventListener('submit', async e=>{
  e.preventDefault();
  const text = t.value.trim();
  if(!text) return;
  // Optimistic UI
  chatEl.insertAdjacentHTML('beforeend', `<div class="msg me"><small>you</small><div>${escape(text)}</div></div>`);
  t.value=''; chatEl.scrollTop = chatEl.scrollHeight;
  await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session, text })
  });
  // server will store and respond; polling will fetch bot/admin replies
});

load();
setInterval(load, 2500); // polling tiap 2.5s
</script>
</body>
</html>
