<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Service Center</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; max-width:600px; margin:auto; }
    label, input, textarea, button { display:block; width:100%; margin-top:8px; }
  </style>
</head>
<body>
  <h1>Service Center</h1>
  <form id="contactForm">
    <label>Nama</label>
    <input name="name" required />
    <label>Email / WA</label>
    <input name="contact" />
    <label>Pertanyaan / Keluhan</label>
    <textarea name="message" rows="6" required></textarea>
    <button type="submit">Kirim</button>
  </form>

  <div id="result" style="margin-top:12px"></div>

  <script>
    const form = document.getElementById('contactForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      result.textContent = 'Mengirim...';
      try {
        const r = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify(data)
        });
        const j = await r.json();
        if (r.ok) {
          result.textContent = 'Pesan berhasil dikirim. Terima kasih!';
          form.reset();
        } else {
          result.textContent = 'Gagal: ' + (j.error || r.status);
        }
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
